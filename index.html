<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Auth</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 90vh;
      margin: 0;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    .btn {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      background: #4285F4;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="content">
    <h2>Autenticação Google</h2>
    <p>Autoriza o bot a aceder aos teus serviços Google.</p>
    <button class="btn" id="login-btn">Entrar com Google</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const CLIENT_ID = "90312023646-0310nco4ki6a6kq40q61lnnt4iflr2k4.apps.googleusercontent.com";
    const REDIRECT_URI = window.location.origin + window.location.pathname;

    // Scopes para Identidade, Calendar, Gmail e Google Sheets
    const SCOPE = [
      "openid",
      "email",
      "profile",
      "https://www.googleapis.com/auth/calendar",
      "https://www.googleapis.com/auth/gmail.modify",
      "https://www.googleapis.com/auth/spreadsheets"
    ].join(" ");

    // Quando a Google redireciona de volta com o ?code=...
    const urlParams = new URLSearchParams(window.location.search);
    const authCode = urlParams.get('code');

    if (authCode) {
      tg.sendData(authCode);
      tg.close();
    }

    document.getElementById('login-btn').onclick = () => {
      const authUrl = `https://accounts.google.com/o/oauth2/v2/auth?` +
        `client_id=${encodeURIComponent(CLIENT_ID)}` +
        `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
        `&response_type=code` +
        `&scope=${encodeURIComponent(SCOPE)}` +
        `&access_type=offline` +
        `&prompt=consent`;
      
      window.location.href = authUrl;
    };
  </script>
</body>
</html>

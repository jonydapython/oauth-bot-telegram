<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Próximos Eventos</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #222222);
      box-sizing: border-box;
    }
    .header {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .events-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .event-card {
      background: var(--tg-theme-secondary-bg-color, #f4f4f5);
      border-radius: 10px;
      padding: 12px 14px;
      border-left: 4px solid var(--tg-theme-button-color, #2481cc);
    }
    .event-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--tg-theme-text-color, #000000);
      word-break: break-word;
    }
    .event-time {
      font-size: 13px;
      color: var(--tg-theme-hint-color, #707579);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .empty-state {
      text-align: center;
      color: var(--tg-theme-hint-color, #888888);
      padding: 40px 16px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="header">📅 Próximos Eventos</div>
  <div class="events-list" id="events-list">
    <div class="empty-state" id="status-msg">A carregar eventos...</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function formatDate(isoStr) {
      if (!isoStr) return '';
      const date = new Date(isoStr);
      // Se for apenas data (evento de dia inteiro)
      if (isoStr.length === 10) {
        return date.toLocaleDateString('pt-PT', { day: '2-digit', month: 'short', year: 'numeric' });
      }
      return date.toLocaleString('pt-PT', {
        day: '2-digit',
        month: 'short',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function renderEvents(items) {
      const container = document.getElementById('events-list');
      container.innerHTML = '';

      if (!items || items.length === 0) {
        container.innerHTML = '<div class="empty-state">Nenhum evento agendado.</div>';
        return;
      }

      items.forEach(ev => {
        const card = document.createElement('div');
        card.className = 'event-card';

        const rawStart = ev.start?.dateTime || ev.start?.date;
        const rawEnd = ev.end?.dateTime || ev.end?.date;
        
        const startFormatted = formatDate(rawStart);
        let timeDisplay = startFormatted;

        if (rawEnd && rawEnd !== rawStart) {
          // Se for no mesmo dia com hora, mostra "14:00 - 15:00"
          if (rawStart.slice(0, 10) === rawEnd.slice(0, 10) && rawStart.includes('T')) {
            const endTime = new Date(rawEnd).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
            timeDisplay = `${startFormatted} às ${endTime}`;
          }
        }

        card.innerHTML = `
          <div class="event-title">${ev.summary || 'Sem título'}</div>
          <div class="event-time">🕒 ${timeDisplay}</div>
        `;
        container.appendChild(card);
      });
    }

    try {
      const params = new URLSearchParams(window.location.search);
      const eventsData = params.get('events');
      if (eventsData) {
        renderEvents(JSON.parse(decodeURIComponent(eventsData)));
      } else {
        document.getElementById('status-msg').innerText = 'Nenhum evento recebido.';
      }
    } catch (e) {
      document.getElementById('status-msg').innerText = 'Erro ao processar lista de eventos.';
    }
  </script>
</body>
</html>
